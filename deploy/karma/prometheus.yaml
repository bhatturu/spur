global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/karma-rules.yaml

scrape_configs:
  - job_name: 'karma-sql'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'dme'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:5050']
